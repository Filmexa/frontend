name: Filmexa action

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:
  

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
  
      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build -- --configuration production

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERUSER }}
          password: ${{ secrets.DOCKERPASSWORD }}
      
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKERUSER }}/filmexa-frontend:latest
            ${{ secrets.DOCKERUSER }}/filmexa-frontend:${{ github.sha }}
  deploy-code:
    name: deploy to server
    needs: test

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare deployment directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_INSTANCE_HOST }}
          username: ${{ secrets.ORACLE_INSTANCE_USER }}
          key: ${{ secrets.ORACLE_INSTANCE_KEY }}
          script: mkdir -p "$HOME/frontend"

      - name: Copy deployment files to server
        run: |
          echo "${{ secrets.ORACLE_INSTANCE_KEY }}" > ssh_key.pem
          chmod 600 ssh_key.pem

          scp -o StrictHostKeyChecking=no -i ssh_key.pem \
            entryscript.sh \
            docker-compose.yml \
            filmexassl.conf \
            ${{ secrets.ORACLE_INSTANCE_USER }}@${{ secrets.ORACLE_INSTANCE_HOST }}:/home/${{ secrets.ORACLE_INSTANCE_USER }}/frontend/

          rm -f ssh_key.pem
      - name: Deploy application
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_INSTANCE_HOST }}
          username: ${{ secrets.ORACLE_INSTANCE_USER }}
          key: ${{ secrets.ORACLE_INSTANCE_KEY }}
          
          script: |
            set -eu

            cd "$HOME/frontend"

            docker network inspect filmexa-net >/dev/null 2>&1 || docker network create filmexa-net
            docker compose pull
            docker compose up -d --remove-orphans

            for i in $(seq 1 30); do
              status="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' filmexa-frontend 2>/dev/null || true)"
              if [ "$status" = "healthy" ]; then
                break
              fi
              sleep 2
            done

            if [ "$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' filmexa-frontend 2>/dev/null || true)" != "healthy" ]; then
              docker compose ps
              docker compose logs --tail=200
              exit 1
            fi

            sh ./entryscript.sh
            docker image prune -f
