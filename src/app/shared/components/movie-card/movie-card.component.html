<div class="group/card">
  <div
    (click)="goToDetails()"
    class="relative rounded overflow-hidden bg-neutral-800 aspect-[2/3] cursor-pointer"
  >
    <img
      [src]="posterUrl"
      [alt]="movie.title"
      (error)="useDefaultPoster($event)"
      loading="lazy"
      class="w-full h-full object-cover transition-transform duration-300 ease-out group-hover/card:scale-110"
    />
  </div>

  <div class="mt-1.5 flex items-center gap-1.5 text-xs text-neutral-400">
    @if (movie.rating > 0) {
      <span class="flex items-center gap-1 font-semibold text-neutral-300">
        <svg class="h-4 w-4 text-yellow-400" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="m12 2.5 2.9 5.88 6.49.94-4.7 4.58 1.11 6.47L12 17.32l-5.8 3.05 1.11-6.47-4.7-4.58 6.49-.94L12 2.5Z" />
        </svg>
        {{ movie.rating.toFixed(1) }}
      </span>
      <span>·</span>
    }
    <span>{{ movie.year }}</span>
  </div>

  <p class="text-sm text-neutral-100 font-medium truncate">{{ movie.title }}</p>
</div>
