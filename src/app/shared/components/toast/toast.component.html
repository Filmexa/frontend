<div class="fixed top-4 right-4 z-50 flex w-full max-w-sm flex-col gap-2">
  @for (toast of toastService.toasts(); track toast.id) {
    <div
      class="flex items-start justify-between gap-3 rounded-lg border px-4 py-3 text-sm shadow-lg backdrop-blur"
      [ngClass]="toast.type === 'success'
        ? 'bg-green-600/10 border-green-600/40 text-green-400'
        : 'bg-red-600/10 border-red-600/40 text-red-400'"
    >
      <p class="flex-1">{{ toast.message }}</p>
      <button
        type="button"
        class="leading-none opacity-70 hover:opacity-100"
        (click)="toastService.dismiss(toast.id)"
        aria-label="Dismiss"
      >
        ×
      </button>
    </div>
  }
</div>
