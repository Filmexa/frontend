<div class="px-4 sm:px-8 lg:px-12 pt-24 sm:pt-28 pb-12 min-h-screen">
  <button
    type="button"
    (click)="goBack()"
    class="flex items-center gap-2 text-neutral-300 hover:text-white transition-colors cursor-pointer mb-6"
  >
    <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M15 18l-6-6 6-6" />
    </svg>
    <span i18n="@@movies.back">Back</span>
  </button>

  <h1 class="text-2xl sm:text-3xl font-extrabold uppercase tracking-tight text-white mb-6">
    {{ category }}
  </h1>

  <div class="grid gap-4 grid-cols-[repeat(auto-fill,minmax(140px,1fr))]">
    @for (movie of movies; track movie.id) {
      <app-movie-card [movie]="movie" />
    }
  </div>

  @if (loading) {
    <div class="flex justify-center py-8">
      <div class="w-8 h-8 border-2 border-neutral-600 border-t-white rounded-full animate-spin"></div>
    </div>
  }

  <div #scrollSentinel class="h-1"></div>
</div>
