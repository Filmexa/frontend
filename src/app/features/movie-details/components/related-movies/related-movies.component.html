<aside class="pr-2 xl:h-full xl:overflow-y-auto">
  <h2 class="sticky top-0 z-10 mb-5 py-1 text-xl font-bold" i18n="@@movieDetails.relatedMovies">Similar movies</h2>

  @if (loading()) {
    <div class="flex justify-center py-12">
      <div class="h-8 w-8 animate-spin rounded-full border-2 border-neutral-600 border-t-white"></div>
    </div>
  } @else if (movies().length) {
    <div class="flex flex-col gap-4">
      @for (relatedMovie of movies(); track relatedMovie.id) {
        <a
          [routerLink]="['/movie', relatedMovie.id]"
          class="group flex gap-3 rounded-lg p-2 transition-colors hover:bg-neutral-800/60"
        >
          <img
            [src]="relatedMovie.poster || defaultPoster"
            [alt]="relatedMovie.title"
            (error)="useDefaultPoster($event)"
            loading="lazy"
            class="h-28 w-20 shrink-0 rounded object-cover"
          />
          <div class="min-w-0 py-1">
            <h3 class="line-clamp-2 font-semibold text-neutral-100 transition-colors group-hover:text-white">
              {{ relatedMovie.title }}
            </h3>
            <p class="mt-2 text-sm text-neutral-400">{{ relatedMovie.year }}</p>
            @if (relatedMovie.rating > 0) {
              <span class="mt-2 flex items-center gap-1 text-sm font-semibold text-neutral-300">
                <svg class="h-4 w-4 text-yellow-400" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                  <path d="m12 2.5 2.9 5.88 6.49.94-4.7 4.58 1.11 6.47L12 17.32l-5.8 3.05 1.11-6.47-4.7-4.58 6.49-.94L12 2.5Z" />
                </svg>
                {{ relatedMovie.rating.toFixed(1) }}
              </span>
            }
          </div>
        </a>
      }
    </div>
  } @else {
    <p class="text-sm text-neutral-400" i18n="@@movieDetails.relatedMoviesEmpty">No similar movies found.</p>
  }
</aside>
