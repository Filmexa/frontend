<article class="group flex flex-col gap-3">
  <div class="aspect-square overflow-hidden rounded-full bg-neutral-800 ring-1 ring-white/10">
    <img
      class="h-full w-full object-cover transition-transform duration-300 group-hover:scale-105"
      [src]="profileUrl"
      [alt]="actor.name"
      (error)="useDefaultProfile($event)"
      loading="lazy"
    />
  </div>

  <div class="min-w-0 text-center">
    <h3 class="truncate text-sm font-semibold text-white sm:text-base">{{ actor.name }}</h3>
    <p class="mt-0.5 truncate text-xs text-neutral-400 sm:text-sm">{{ actor.character }}</p>
  </div>
</article>
