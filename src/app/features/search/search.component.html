<div class="px-4 sm:px-8 lg:px-12 pt-24 sm:pt-28 pb-12 min-h-screen">
  <form (ngSubmit)="applyFilters()" class="flex flex-col sm:flex-row gap-3 mb-4">
    <input
      type="text"
      name="query"
      [(ngModel)]="query"
      (ngModelChange)="applyFilters()"
      placeholder="Search movies and TV shows..."
      i18n-placeholder="@@search.placeholder"
      class="flex-1 rounded bg-neutral-800 text-white placeholder-neutral-400 px-4 py-3 outline-none focus:ring-2 focus:ring-red-600"
    />

    <button
      type="submit"
      class="rounded text-white px-6 py-3 font-semibold bg-red-600 hover:bg-red-500 transition-colors cursor-pointer"
      i18n="@@search.searchButton"
    >
      Search
    </button>
  </form>

  <div class="flex flex-wrap items-center gap-3 mb-8">
    <select
      name="genre"
      [(ngModel)]="selectedGenreId"
      (ngModelChange)="applyFilters()"
      class="rounded bg-neutral-800 text-white text-sm px-3 py-2 outline-none cursor-pointer"
    >
      <option value="all" i18n="@@search.allGenres">All Genres</option>
      @for (genre of genres; track genre.id) {
        <option [value]="genre.genreId">{{ genre.name }}</option>
      }
    </select>

    <select
      name="rating"
      [(ngModel)]="selectedRating"
      (ngModelChange)="applyFilters()"
      class="rounded bg-neutral-800 text-white text-sm px-3 py-2 outline-none cursor-pointer"
    >
      <option value="any" i18n="@@search.anyRating">Any Rating</option>
      <option value="9">9+</option>
      <option value="8">8+</option>
      <option value="7">7+</option>
      <option value="6">6+</option>
    </select>

    <select
      name="year"
      [(ngModel)]="selectedYear"
      (ngModelChange)="applyFilters()"
      class="rounded bg-neutral-800 text-white text-sm px-3 py-2 outline-none cursor-pointer"
    >
      <option value="any" i18n="@@search.anyYear">Any Year</option>
      @for (year of years; track year) {
        <option [value]="year">{{ year }}</option>
      }
    </select>

    <select
      name="sort"
      [(ngModel)]="sort"
      (ngModelChange)="applyFilters()"
      class="rounded bg-neutral-800 text-white text-sm px-3 py-2 outline-none cursor-pointer"
    >
      <option value="popularity" i18n="@@search.sortPopular">Most Popular</option>
      <option value="rating" i18n="@@search.sortRating">Highest Rated</option>
      <option value="releaseDate" i18n="@@search.sortReleaseDate">Release Date</option>
    </select>

    @if (hasActiveFilters) {
      <button
        type="button"
        (click)="clearFilters()"
        class="text-sm text-neutral-400 hover:text-white transition-colors cursor-pointer"
        i18n="@@search.clearFilters"
      >
        Clear filters
      </button>
    }
  </div>

  @if (hasSearched) {
    @if (results.length) {
      <div class="grid gap-4 grid-cols-[repeat(auto-fill,minmax(140px,1fr))]">
        @for (movie of results; track movie.id) {
          <app-movie-card [movie]="movie" />
        }
      </div>

    } @else if (!loading) {
      <p class="text-neutral-400" i18n="@@search.noResults">No movies match your search.</p>
    }

    @if (loading) {
      <div class="flex justify-center py-8" aria-label="Loading search results" i18n-aria-label="@@search.loading">
        <div class="h-8 w-8 animate-spin rounded-full border-2 border-neutral-600 border-t-white"></div>
      </div>
    }
  } @else {
    <p class="text-neutral-500" i18n="@@search.prompt">Search by title or use the filters above to browse movies.</p>
  }

  <div #scrollSentinel class="h-1" aria-hidden="true"></div>
</div>
