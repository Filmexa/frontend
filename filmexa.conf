server {
    listen 80;
    server_name filmexa.duckdns.org;

    # Resolve the backend at request time so Nginx can start while the backend
    # stack is temporarily unavailable during independent deployments.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $backend_upstream http://filmexa-backend:8080;

    location / {
        root /usr/share/nginx/html/en-US;
        try_files $uri $uri/ /index.html;
    }

    # French
    location /fr/ {
        alias /usr/share/nginx/html/fr/;
        try_files $uri $uri/ /fr/index.html;
    }

    # Arabic
    location /ar/ {
        alias /usr/share/nginx/html/ar/;
        try_files $uri $uri/ /ar/index.html;
    }

    # Spring Boot API
    location /api/ {
        proxy_pass $backend_upstream;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
